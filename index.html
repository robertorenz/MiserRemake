<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MISER — A 2.5D Remake of the Classic Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <header id="masthead">
    <div class="mast-left">
      <h1>MISER</h1>
      <span class="mast-sub">a 2.5D remake of the 1981 classic by M.J. Lansing</span>
    </div>
    <div class="mast-right">
      <span id="score-chip" title="Treasures deposited on the front porch">Treasures <b id="score">0</b><i>/</i><span id="score-max">?</span></span>
      <button id="btn-help" class="chip-btn" type="button">Help</button>
      <button id="btn-restart" class="chip-btn" type="button">Restart</button>
    </div>
  </header>

  <main id="stage">
    <div id="scene-wrap">
      <svg id="scene" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Current room view"></svg>
      <div id="room-plate">
        <span id="room-name">&nbsp;</span>
      </div>
      <div id="hotspot-tip" hidden></div>
      <div id="minimap" hidden>
        <div id="minimap-label"><span id="mm-layer"></span><span id="mm-north">N &uarr;</span></div>
        <svg id="minimap-svg" aria-label="Map of rooms you have visited"></svg>
      </div>
      <button id="btn-turn" class="turn-btn" type="button" title="Go back the way you came" hidden>&#8635; turn around</button>
    </div>

    <aside id="satchel">
      <h2>Satchel</h2>
      <ul id="inventory"></ul>
      <p id="satchel-empty" class="satchel-empty">empty-handed</p>
    </aside>
  </main>

  <section id="console">
    <div id="log" aria-live="polite"></div>
    <form id="cmdform" autocomplete="off">
      <span class="prompt-mark">&gt;</span>
      <input id="cmd" type="text" spellcheck="false" placeholder="type a command, or click things in the room&hellip;" aria-label="Command input">
    </form>
  </section>
</div>

<!-- Modal (used for intro, help, death, victory — never alert()) -->
<div id="modal-veil" hidden>
  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <div id="modal-actions"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/scene.js"></script>
<script src="js/engine.js"></script>
<script src="js/main.js"></script>
</body>
</html>
